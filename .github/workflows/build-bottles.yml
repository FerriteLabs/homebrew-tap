name: Build Bottles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Ferrite version (e.g., 0.4.0)"
        required: true
        type: string
  repository_dispatch:
    types: [new-release]

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # Untrusted event data is passed through env: and never
      # interpolated with the double-brace expression syntax directly
      # into a run: shell body, matching the hardening applied to
      # update-formula.yml.
      - name: Resolve version from triggering event
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          WORKFLOW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            VERSION="${DISPATCH_VERSION}"
          else
            VERSION="${WORKFLOW_VERSION}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "::error::No version supplied by the triggering event"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate strict SemVer version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          SEMVER_REGEX="^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$"
          if ! [[ "${VERSION}" =~ ${SEMVER_REGEX} ]]; then
            echo "::error::\"${VERSION}\" is not a valid strict SemVer version (expected e.g. 1.2.3)"
            exit 1
          fi
          echo "Version ${VERSION} is valid SemVer"

  bottle:
    name: Build bottle (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64_sonoma
          - os: macos-14
            arch: arm64_ventura
          - os: macos-13
            arch: sonoma
          - os: macos-13
            arch: ventura
          - os: ubuntu-latest
            arch: x86_64_linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@v1

      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build bottle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          brew install --build-bottle ./ferrite.rb
          brew bottle --json --root-url="https://github.com/ferritelabs/homebrew-tap/releases/download/v${VERSION}" ./ferrite.rb

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.arch }}
          path: |
            ferrite--*.bottle.tar.gz
            ferrite--*.bottle.json

  collect:
    name: Merge bottles and open pull request
    needs: [validate, bottle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@v1

      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Download all bottles
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Validate expected bottle artifacts were produced
        run: |
          set -euo pipefail
          EXPECTED_COUNT=5
          ACTUAL_COUNT="$(find . -maxdepth 1 -name "ferrite--*.bottle.json" | wc -l | tr -d "[:space:]")"
          if [ "${ACTUAL_COUNT}" -ne "${EXPECTED_COUNT}" ]; then
            echo "::error::Expected ${EXPECTED_COUNT} bottle JSON artifacts (one per matrix platform) but found ${ACTUAL_COUNT}. Refusing to merge a partial bottle set."
            exit 1
          fi
          echo "Found all ${ACTUAL_COUNT} expected bottle artifacts"

      # Canonical Homebrew merge: brew bottle --merge reads the
      # per-platform JSON manifests and writes (or inserts, if none
      # exists yet) a single bottle do ... end block into the formula
      # file itself. This replaces the previous hand-rolled
      # regex/placeholder-substitution approach, which only worked when
      # a bottle block with matching platform keys already existed.
      - name: Merge bottle metadata into the formula
        run: |
          set -euo pipefail
          brew tap ferritelabs/homebrew-tap "$(pwd)"
          brew bottle --merge --write --no-commit ferrite--*.bottle.json
          echo "Merged bottle metadata:"
          sed -n "/bottle do/,/^  end/p" ferrite.rb

      - name: Run formula syntax check and fast test suite
        run: |
          set -euo pipefail
          ruby -c ferrite.rb
          bash tests/run.sh --fast

      - name: Run brew audit on the updated formula
        run: brew audit --strict --online ./ferrite.rb

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: add bottle checksums for v${{ needs.validate.outputs.version }}"
          title: "chore: add bottle checksums for v${{ needs.validate.outputs.version }}"
          body: |
            Automated bottle metadata update for Ferrite v${{ needs.validate.outputs.version }}.

            Generated by `brew bottle --merge` from the per-platform bottle
            manifests built in this workflow run. No direct push to main is
            made; this pull request goes through normal CI and review like
            any other formula change.
          branch: update-ferrite-bottles-${{ needs.validate.outputs.version }}
          base: main

      - name: Create release with bottles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          files: ferrite--*.bottle.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
