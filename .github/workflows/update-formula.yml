name: Update Formula

on:
  repository_dispatch:
    types: [ferrite-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Ferrite version (e.g. 0.4.0)"
        required: true
      sha256:
        description: "Advisory SHA256 of the release tarball (verified, never trusted blindly - the workflow always (re)computes the canonical checksum itself and fails if this does not match)"
        required: false

jobs:
  update:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Untrusted event data (repository_dispatch client_payload or
      # workflow_dispatch inputs) is passed through `env:` and never
      # interpolated with `${{ }}` directly into a `run:` script body, so
      # a malicious payload cannot inject shell syntax.
      - name: Resolve and validate stable release inputs
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_SHA256: ${{ github.event.client_payload.sha256 }}
          WORKFLOW_VERSION: ${{ inputs.version }}
          WORKFLOW_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            VERSION="${DISPATCH_VERSION}"
            SUPPLIED_SHA256="${DISPATCH_SHA256}"
          else
            VERSION="${WORKFLOW_VERSION}"
            SUPPLIED_SHA256="${WORKFLOW_SHA256}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "::error::No version supplied by the triggering event"
            exit 1
          fi

          # Validate before exposing the value to any URL, branch, tag, or
          # later workflow step. The shared validator accepts stable releases
          # exactly X.Y.Z and rejects leading zeroes, prereleases, metadata,
          # prefixes, whitespace, and extra components.
          if ! VERSION="$(ruby scripts/release_version.rb "${VERSION}")"; then
            exit 1
          fi

          if [ -n "${SUPPLIED_SHA256}" ] && ! [[ "${SUPPLIED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Supplied sha256 must be empty or 64 lowercase hexadecimal characters"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "release_tag=v${VERSION}"
            echo "formula_branch=update-ferrite-${VERSION}"
            echo "archive_url=https://github.com/ferritelabs/ferrite/archive/refs/tags/v${VERSION}.tar.gz"
            echo "supplied_sha256=${SUPPLIED_SHA256}"
          } >> "$GITHUB_OUTPUT"

      # The canonical checksum is *always* recomputed from the real
      # tagged archive. A caller-supplied sha256 (from workflow_dispatch
      # or repository_dispatch) is only ever used as an advisory
      # cross-check; it is never written to the formula directly.
      - name: Compute canonical archive checksum
        id: checksum
        env:
          ARCHIVE_URL: ${{ steps.release.outputs.archive_url }}
          SUPPLIED_SHA256: ${{ steps.release.outputs.supplied_sha256 }}
        run: |
          set -euo pipefail
          echo "Downloading canonical tagged archive: ${ARCHIVE_URL}"

          COMPUTED_SHA256="$(curl -sSL --fail "${ARCHIVE_URL}" | sha256sum | awk "{print \$1}")"
          if [ -z "${COMPUTED_SHA256}" ]; then
            echo "::error::Failed to download or hash ${ARCHIVE_URL}"
            exit 1
          fi
          echo "Computed canonical sha256: ${COMPUTED_SHA256}"

          if [ -n "${SUPPLIED_SHA256}" ] && [ "${SUPPLIED_SHA256}" != "${COMPUTED_SHA256}" ]; then
            echo "::error::Supplied sha256 (${SUPPLIED_SHA256}) does not match the computed canonical checksum (${COMPUTED_SHA256}) for ${ARCHIVE_URL}. Refusing to trust the supplied value; the tarball may have changed or the input may be wrong."
            exit 1
          fi

          echo "sha256=${COMPUTED_SHA256}" >> "$GITHUB_OUTPUT"
          echo "url=${ARCHIVE_URL}" >> "$GITHUB_OUTPUT"

      # A version bump invalidates every bottle from the prior version.
      # The updater removes the complete old bottle block in-memory before
      # changing the source url/sha256, validates the result, then replaces
      # each file via a same-directory atomic rename.
      - name: Update formula and canonical metadata atomically
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          ARCHIVE_URL: ${{ steps.checksum.outputs.url }}
        run: |
          set -euo pipefail
          ruby scripts/update_formula.rb

      - name: Run formula syntax check and fast test suite
        run: |
          set -euo pipefail
          ruby -c ferrite.rb
          bash tests/run.sh --fast

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump ferrite to ${{ steps.release.outputs.release_tag }}"
          title: "chore: bump ferrite to ${{ steps.release.outputs.release_tag }}"
          body: |
            Automated formula update for Ferrite ${{ steps.release.outputs.release_tag }}.

            Canonical SHA256 (recomputed from the tagged archive, not trusted
            from the triggering event): `${{ steps.checksum.outputs.sha256 }}`
          branch: ${{ steps.release.outputs.formula_branch }}
          base: main
