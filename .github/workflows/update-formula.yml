name: Update Formula

on:
  repository_dispatch:
    types: [ferrite-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Ferrite version (e.g. 0.1.0)'
        required: true
      sha256:
        description: 'SHA256 of the release tarball'
        required: true

jobs:
  update:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version and SHA
        id: release
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
            echo "sha256=${{ github.event.client_payload.sha256 }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "sha256=${{ inputs.sha256 }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update formula
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          SHA256="${{ steps.release.outputs.sha256 }}"
          
          # Update URL
          sed -i "s|url \".*\"|url \"https://github.com/ferritelabs/ferrite/archive/refs/tags/v${VERSION}.tar.gz\"|" ferrite.rb
          
          # Update only the source tarball SHA256 (first occurrence, not bottle checksums)
          # The source sha256 is the one NOT inside the bottle block (no cellar: prefix)
          awk -v sha="$SHA256" '
            /sha256 "/ && !done && !/cellar:/ {
              sub(/sha256 ".*"/, "sha256 \"" sha "\"")
              done = 1
            }
            { print }
          ' ferrite.rb > ferrite.rb.tmp && mv ferrite.rb.tmp ferrite.rb
          
          # Note: Bottle checksums are updated separately by the build-bottles workflow
          echo "Updated source SHA256 to ${SHA256}"
          echo "Bottle checksums will be updated when bottles are built"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump ferrite to v${{ steps.release.outputs.version }}"
          title: "chore: bump ferrite to v${{ steps.release.outputs.version }}"
          body: |
            Automated formula update for Ferrite v${{ steps.release.outputs.version }}.
            SHA256: `${{ steps.release.outputs.sha256 }}`
          branch: update-ferrite-${{ steps.release.outputs.version }}
          base: main
